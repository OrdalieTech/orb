<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Orb</title>
  <link rel="icon" href="ordalie.svg">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <section id="pair" hidden>
    <div id="invite">
      <h1>Pair this tab</h1>
      <p>On your computer, run</p>
      <code>orb mitosis --browser</code>
      <p class="meta">then paste the code it shows. It asks you to approve this tab there.</p>
      <textarea id="code" rows="3" placeholder="orb-mitosis:v1:…" spellcheck="false"></textarea>
      <button id="join" class="inverted" type="button">pair</button>
    </div>
    <div id="approve" hidden>
      <h1>Approve on the computer</h1>
      <p>On the computer, answer y. It shows this tab as</p>
      <strong id="fingerprint"></strong>
      <p id="self" class="meta"></p>
      <p><span class="dot"></span>waiting for the yes</p>
    </div>
  </section>
  <section id="chat" hidden>
    <nav id="bar"><b id="orb" class="stretch">ORB</b><div id="tabs"></div><button id="new" type="button" aria-label="New conversation">+</button><span id="context" title="Context in use" hidden><span id="gauge"></span><small></small></span><button id="menu" type="button" aria-label="Settings"><i></i></button></nav>
    <div id="transcript" tabindex="0" aria-label="Messages">
      <div id="messages"></div>
      <div id="stream" class="assistant" hidden></div>
    </div>
    <form id="prompt-form">
      <textarea id="prompt" rows="2" maxlength="16384" placeholder="What next?" aria-label="Message"></textarea>
      <div><button id="model" type="button"><i></i><span id="status"></span><span id="meter"></span></button><button id="send" class="round" aria-label="Send"></button></div>
    </form>
  </section>
  <section id="settings" hidden>
    <nav id="pages">
      <h1>Settings</h1><p class="meta">this tab</p>
      <button type="button" data-page="general">General</button><button type="button" data-page="providers">Providers</button>
      <button type="button" data-page="plugins">Plugins</button><button type="button" data-page="mitosis">Mitosis</button>
      <button id="back" type="button">‹  conversations <small>esc</small></button>
    </nav>
    <div id="page"></div>
  </section>
  <dialog id="models"><input id="filter" placeholder="Find a model" autocomplete="off" spellcheck="false"><div id="levels"></div><div id="list"></div></dialog>
  <p id="error" role="alert" hidden></p>
</body>
</html>
