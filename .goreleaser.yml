version: 2
project_name: orb
builds:
  - id: orb
    main: ./cmd/orb
    binary: orb
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -funcalign=4 -X main.version={{.Version}}
archives:
  - formats: [tar.gz]
    name_template: "orb_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
source:
  enabled: true
  name_template: "orb_{{ .Version }}_source"
  format: tar.gz
  prefix_template: "orb-{{ .Version }}/"
homebrew_casks:
  - name: orb
    repository:
      owner: OrdalieTech
      name: homebrew-tap
    skip_upload: true
    homepage: https://github.com/OrdalieTech/orb
    description: Faithful, slim, pure-Go port of the pi coding agent
    license: MIT
checksum:
  name_template: checksums.txt
release:
  prerelease: auto
changelog:
  disable: true
